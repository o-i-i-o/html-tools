<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1">
  <title>随机密码生成 - 在线工具</title>
  <link href="style/password.css" rel="stylesheet">
</head>
<body>
  <div id="page">
    <div class="page_wrapper">
      <div class="main_body wrapper a-p vblock-s" style="max-width: 850px">

        <div class="title-row">
          <h4 id="text-config"></h4>
          <button id="btn-lang" class="lang-toggle" type="button">EN</button>
        </div>

        <div class="row">
          <div id="chk-num" class="checkbox checked" role="checkbox" aria-checked="true" tabindex="0"></div>
          <div id="chk-lower" class="checkbox checked" role="checkbox" aria-checked="true" tabindex="0"></div>
          <div id="chk-upper" class="checkbox checked" role="checkbox" aria-checked="true" tabindex="0"></div>
          <div id="chk-other" class="checkbox checked" role="checkbox" aria-checked="true" tabindex="0"></div>
          <div class="input input-small" style="width: 311px">
            <div class="input-inner">
              <input id="input-other-char" type="text" value="!@#$%^&*">
            </div>
          </div>
        </div>
        <div class="row">
          <div id="chk-confuse" class="checkbox" role="checkbox" aria-checked="false" tabindex="0"></div>
        </div>

        <h4 id="text-length"></h4>
        <div class="row">
          <div class="input input-small" style="width: 200px">
            <div class="input-inner">
              <input id="input-length" type="number" value="8" max="128" min="1" maxlength="3">
            </div>
          </div>
          <span class="hint" id="text-length-hint"></span>
        </div>

        <h4 id="text-count"></h4>
        <div class="row">
          <div class="input input-small" style="width: 200px">
            <div class="input-inner">
              <input id="input-count" type="number" value="5" max="50" min="1">
            </div>
          </div>
          <span class="hint" id="text-count-hint"></span>
        </div>

        <h4 id="text-password"></h4>
        <div id="password-list"></div>
        <div class="row" style="margin-top: 10px">
          <button id="btn-copy-all" class="button button-primary button-small"></button>
          <button id="btn-refresh" class="button button-success button-small"></button>
        </div>

        <div class="statement">
          <h2 class="lsb" id="text-safety-title"></h2>
          <p id="text-safety-1"></p>
          <p id="text-safety-2"></p>
          <p id="text-safety-3"></p>
          <p id="text-safety-4"></p>
        </div>

      </div>
    </div>
  </div>

  <script src="lib/app.js"></script>
</body>
</html>
