<div style="margin-left:1rem;margin-top:1.25rem;">

<b>一、计算两个日期之间差多少天</b>
<table>
<tr>
<td>
<td>
<input type=number class=y id=SY2>年
<input type=number class=d id=SM2>月
<input type=number class=d id=SD2>日（默认今天）
<tr>
<td style="width:1rem" valign=top>
距
<td><input type=number class=y id=SY3>年
<input type=number class=d id=SM3>月
<input type=number class=d id=SD3>日
<tr>
<td>
<td>
<input type=button value=" 相 差 " onclick="daydiff()">
<span class="res" id=result2></span>
</table>



<br />
<b>二、推算几天后的日期</b>


<table>
<tr>
<td>
<td>
<input type=number class=y id=SY name=SY>年
<input type=number class=d id=SM name=SM>月
<input type=number class=d id=SD name=SD>日（默认今天）
<tr>
<td style="width:1rem">&nbsp;
<td>
<select id="pom">
<option value=1>往后</option>

</select>

<input type=number class=y id=dnum >
<select id="dtype" onchange="typesel(this)">
    <option value=1>日</option>

    <option value=2>星期</option>  
    <option value=3>月</option>      
    </select>

<div style="margin-left:1rem;margin-top:2rem;">
【日期间隔和推算说明】
<br />
一、计算两个日期之间相差几天、几周、几个月，前一个日期更晚则结果为负数。
<br />
二、计算某日往后或者往前若干天、若干星期、若干月的日期，并给出农历日期。
<br />
* 输入均为阳历，最早有效日期为1901年1月1日。月、日数值如果超出范围，则自动调整为正确日期。比如输入11月32日，则调整为12月2日。
<br>
* 当前工作日计算范围是从<span id="wstart"></span> 至 <span id="wend"></span>。
